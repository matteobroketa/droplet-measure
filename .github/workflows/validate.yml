name: Validate static app
on:
  push:
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check required files and accidental remote dependencies
        run: |
          test -f index.html
          test -f README.md
          test -f docs/ANALYTICAL_METHOD.md
          ! grep -E '<script[^>]+src="https?://|<link[^>]+href="https?://' index.html
          grep -q '<!doctype html>' index.html
      - name: Check inline JavaScript syntax
        run: |
          node <<'NODE'
          const fs = require('fs');
          const html = fs.readFileSync('index.html', 'utf8');
          const start = html.indexOf('<script>');
          const end = html.lastIndexOf('</script>');
          if (start < 0 || end < 0 || end <= start) throw new Error('inline script not found');
          new Function(html.slice(start + '<script>'.length, end));
          console.log('inline JavaScript syntax: OK');
          NODE
